# ============================================
# Docker Compose Override - Development
# ============================================
# Use with: docker compose -f docker-compose.yml -f docker-compose.override.yml up
# This provides hot-reload for development

version: "3.9"

services:
  backend:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    environment:
      NODE_ENV: development
      JWT_EXPIRES_IN: 24h
      THROTTLE_LIMIT: 1000

  frontend:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      NODE_ENV: development

  # Database admin UI (development only)
  pgadmin:
    image: dpage/pgadmin4
    container_name: erp-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@erp.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - erp-network

volumes:
  pgadmin_data:
    driver: local
